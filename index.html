<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocalBazzarao – Flights, cabs & stays for Delhi</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#14172e;--mute:#5d6380;--line:#dde1ee;--brand:#1b1f3b;--on-brand:#fff;--gold:#f2a900;--prem:#7b3fa0;--norm:#b98300;--cheap:#1f6fd1;--bot:#e8ebf6;--me:#1b1f3b;--me-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1022;--card:#181b36;--ink:#eceefb;--mute:#9aa0c4;--line:#2a2e52;--brand:#f2a900;--on-brand:#14172e;--bot:#20244a;--me:#f2a900;--me-ink:#14172e;--prem:#b987e0;--norm:#f2c14e;--cheap:#6aa6f5}}
:root[data-theme="dark"]{--bg:#0e1022;--card:#181b36;--ink:#eceefb;--mute:#9aa0c4;--line:#2a2e52;--brand:#f2a900;--on-brand:#14172e;--bot:#20244a;--me:#f2a900;--me-ink:#14172e;--prem:#b987e0;--norm:#f2c14e;--cheap:#6aa6f5}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
/* auth */
#auth{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
.hero{background:var(--brand);color:var(--on-brand);padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.logo{font-weight:700;font-size:22px;letter-spacing:-.02em}
.hero h1{font-size:clamp(30px,4vw,48px);line-height:1.1;margin:0 0 16px;letter-spacing:-.03em;max-width:12em}
.hero p{max-width:30em;opacity:.85;margin:0}
.lines{display:flex;gap:8px;margin-top:28px}
.lines span{height:8px;border-radius:4px;flex:1;max-width:90px}
.formwrap{display:flex;align-items:center;justify-content:center;padding:32px}
.box{width:100%;max-width:380px}
.tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:22px}
.tabs button{flex:1;background:none;border:0;padding:10px;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--gold)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=email],input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.btn{background:var(--brand);color:var(--on-brand);border:0;border-radius:10px;padding:12px 18px;font-weight:600;cursor:pointer}
.btn.full{width:100%;margin-top:22px}
.err{color:#c0392b;font-size:13px;min-height:20px;margin-top:10px}
/* app */
#app{height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
header .who{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:13px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
#thread{flex:1;overflow-y:auto;padding:20px 18px}
.m{max-width:85%;margin:0 0 12px;padding:11px 15px;border-radius:16px;white-space:pre-wrap}
.m.bot{background:var(--bot);border-bottom-left-radius:4px}
.m.me{background:var(--me);color:var(--me-ink);margin-left:auto;border-bottom-right-radius:4px}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 16px}
.tier{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tier h3{margin:0;font-size:15px;color:var(--c)}
.tier .t{font-weight:600}
.tier .d{color:var(--mute);font-size:13px}
.tier .p{font-size:22px;font-weight:700;margin-top:auto;padding-top:8px}
.tier .btn{margin-top:6px;background:var(--c);color:#fff}
#dock{padding:8px 18px 0;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--gold)}
#bar{display:flex;gap:10px;padding:12px 18px 16px}
#bar input{flex:1}
#main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 340px}
#chat{display:flex;flex-direction:column;min-height:0}
#side{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;padding:16px}
.tiers{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
select,input[type=date]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.icon{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 2px;cursor:pointer;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.icon span{font-size:24px}
.icon[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold)}
#panel h2{font-size:17px;margin:0 0 4px}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .chip{border-radius:12px;padding:14px 8px;text-align:center}
#mtabs{display:none}
@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.m{animation:fade .25s}
.tier{transition:transform .2s,box-shadow .2s}.tier:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.15)}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.pc{position:relative;display:block;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:0;padding:0;cursor:pointer;text-align:left;color:#fff;animation:fade .5s;transition:transform .2s,box-shadow .2s}
div.pc{cursor:default}button.pc:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.pc .art,.pc img{position:absolute;inset:0;width:100%;height:100%}.pc img{object-fit:cover}.pc svg{width:100%;height:100%;display:block}
.pc .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;flex-direction:column}
.pc .cap b{font-size:13px}.pc .cap small{font-size:11px;opacity:.9;line-height:1.3}
.slide{margin-top:24px;max-width:340px}.slide .pc{aspect-ratio:16/10}
.prow{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,170px));gap:10px;margin:0 0 14px}
.cf{position:fixed;top:-10px;font-size:20px;pointer-events:none;z-index:50;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
#waBtn{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:40;transition:transform .2s}#waBtn:hover{transform:scale(1.08)}
#wa{position:fixed;right:16px;bottom:calc(152px + env(safe-area-inset-bottom,0px));width:300px;max-width:calc(100vw - 32px);height:380px;max-height:calc(100% - 180px);display:flex;flex-direction:column;border-radius:14px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.35);z-index:40;background:#efeae2;color:#111;animation:fade .2s}
.wah{background:#075e54;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}.wah small{display:block;opacity:.8;font-size:11px}.wah button{margin-left:auto;background:none;border:0;color:#fff;cursor:pointer;font-size:16px}
.av{width:34px;height:34px;border-radius:50%;background:#25d366;display:grid;place-items:center;font-weight:700;font-size:12px}
#wam{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.wb{max-width:80%;padding:7px 10px;border-radius:8px;font-size:13px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.15)}.wb.bot{background:#fff;align-self:flex-start}.wb.me{background:#d9fdd3;align-self:flex-end}.wb a{color:#0a7d4f;font-weight:600}
#waq{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px}#waq button{border:1px solid #25d366;background:#fff;color:#075e54;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.waf{display:flex;gap:6px;padding:8px;background:#f0f0f0}.waf input{flex:1;border:0;border-radius:20px;padding:8px 12px;font-size:13px;background:#fff;color:#111}.waf button{width:36px;border:0;border-radius:50%;background:#25d366;color:#fff;cursor:pointer}
@media(prefers-reduced-motion:reduce){.pc,.m,#wa{animation:none}}
@media(max-width:860px){#mtabs{display:flex;border-bottom:1px solid var(--line)}#mtabs button{flex:1;background:none;border:0;padding:10px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}#mtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--gold)}#main{grid-template-columns:1fr}#side{border-left:0}#app[data-view="chat"] #side{display:none}#app[data-view="book"] #chat{display:none}}
@media(max-width:760px){#auth{grid-template-columns:1fr}.hero{padding:28px 24px;gap:20px}.tiers{grid-template-columns:1fr}.m{max-width:94%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<section id="auth">
  <div class="hero">
    <div class="logo">LocalBazzarao</div>
    <div>
      <h1>One chat to book your Delhi trip.</h1>
      <p>Flights, cabs and hotels in one place. For every route we show a premium, a normal and the cheapest way to get there, including the metro.</p>
      <div id="slide" class="slide" aria-hidden="true"></div>
      <div class="lines"><span style="background:#7b3fa0"></span><span style="background:#f2a900"></span><span style="background:#1f6fd1"></span></div>
    </div>
    <small style="opacity:.6">Demo build: prices are estimates.</small>
  </div>
  <div class="formwrap"><div class="box">
    <div class="tabs" role="tablist">
      <button role="tab" id="tLogin" aria-selected="true">Log in</button>
      <button role="tab" id="tReg" aria-selected="false">Create account</button>
    </div>
    <div id="nameRow" class="hidden"><label for="fn">Full name</label><input type="text" id="fn" autocomplete="name"></div>
    <label for="em">Email</label><input type="email" id="em" autocomplete="email">
    <label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password">
    <div class="err" id="err" role="alert"></div>
    <button class="btn full" id="go">Log in</button>
  </div></div>
</section>

<section id="app" class="hidden">
  <header>
    <div class="logo">LocalBazzarao</div>
    <div class="who"><span id="uname"></span><button class="ghost" id="theme" aria-label="Toggle dark mode">🌙</button><button class="ghost" id="out">Log out</button></div>
  </header>
  <div id="mtabs" role="tablist"><button id="mtChat" aria-selected="true">Chat</button><button id="mtBook" aria-selected="false">Quick book</button></div>
  <div id="main"><div id="chat">
  <div id="thread" aria-live="polite"></div>
  <div id="dock"></div>
  <div id="bar">
    <input type="text" id="msg" placeholder="Type where you want to go…" aria-label="Message">
    <button class="btn" id="send">Send</button>
  </div>
  </div>
  <aside id="side" aria-label="Quick book"><div class="icons" id="icons"></div><div id="panel"></div></aside>
  </div>
</section>

<button id="waBtn" aria-label="Chat with Chotu">💬</button>
<div id="wa" class="hidden" role="dialog" aria-label="Chotu support chat">
  <div class="wah"><span class="av">LB</span><div><b>Chotu · LocalBazzarao</b><small>replies instantly</small></div><button id="waX" aria-label="Close chat">✕</button></div>
  <div id="wam"></div><div id="waq"></div>
  <div class="waf"><input type="text" id="wai" placeholder="Type a message" aria-label="Message Chotu"><button id="was" aria-label="Send">➤</button></div>
</div>

<script>
/* ---------- storage (falls back to memory if blocked) ---------- */
var mem={};
function sget(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return mem[k]||null}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
function sdel(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
var $=function(i){return document.getElementById(i)};

/* ---------- auth (DEMO ONLY: replace with a real backend) ---------- */
var mode="login";
function setMode(m){mode=m;
  $("tLogin").setAttribute("aria-selected",m==="login");$("tReg").setAttribute("aria-selected",m==="reg");
  $("nameRow").classList.toggle("hidden",m==="login");
  $("go").textContent=m==="login"?"Log in":"Create account";$("err").textContent="";}
$("tLogin").onclick=function(){setMode("login")};$("tReg").onclick=function(){setMode("reg")};
$("go").onclick=function(){
  var em=$("em").value.trim().toLowerCase(),pw=$("pw").value,fn=$("fn").value.trim(),users=sget("dg_users")||{};
  if(!/^\S+@\S+\.\S+$/.test(em)){$("err").textContent="Enter a valid email address.";return}
  if(mode==="reg"){
    if(!fn){$("err").textContent="Enter your name.";return}
    if(pw.length<6){$("err").textContent="Password needs at least 6 characters.";return}
    if(users[em]){$("err").textContent="This email is already registered. Log in instead.";return}
    users[em]={name:fn,pw:pw};sset("dg_users",users);start({email:em,name:fn});
  }else{
    if(!users[em]||users[em].pw!==pw){$("err").textContent="Email or password is incorrect.";return}
    start({email:em,name:users[em].name});
  }
};
$("out").onclick=function(){sdel("dg_session");location.reload()};

/* ---------- data ---------- */
var R=function(a,b){return{lat:a,lng:b}};
var ORIGINS=[
 {n:"IGI Airport",k:["igi","airport","t3","indira"],c:R(28.5562,77.1000),m:"Airport (Airport Express)"},
 {n:"New Delhi Station",k:["new delhi st","ndls","new delhi rail"],c:R(28.6425,77.2194),m:"New Delhi"},
 {n:"Old Delhi Station",k:["old delhi","nzm","delhi junction"],c:R(28.6616,77.2276),m:"Chandni Chowk"},
 {n:"Anand Vihar",k:["anand vihar","isbt"],c:R(28.6469,77.3159),m:"Anand Vihar"}
];
var PLACES=[
 {n:"Connaught Place",k:["connaught","cp"],c:R(28.6315,77.2167),m:"Rajiv Chowk",f:1.15},
 {n:"India Gate",k:["india gate","kartavya"],c:R(28.6129,77.2295),m:"Central Secretariat",f:1.2},
 {n:"Red Fort",k:["red fort","lal qila"],c:R(28.6562,77.2410),m:"Lal Qila",f:1},
 {n:"Qutub Minar",k:["qutub","kutub"],c:R(28.5245,77.1855),m:"Qutub Minar",f:1},
 {n:"Hauz Khas",k:["hauz","hkv"],c:R(28.5494,77.2001),m:"Hauz Khas",f:1.05},
 {n:"Akshardham",k:["akshardham"],c:R(28.6127,77.2773),m:"Akshardham",f:1},
 {n:"Lotus Temple",k:["lotus"],c:R(28.5535,77.2588),m:"Kalkaji Mandir",f:1},
 {n:"Chandni Chowk",k:["chandni"],c:R(28.6506,77.2303),m:"Chandni Chowk",f:.9},
 {n:"Saket",k:["saket"],c:R(28.5245,77.2066),m:"Saket",f:1},
 {n:"Cyber Hub Gurugram",k:["cyber","gurgaon","gurugram"],c:R(28.4950,77.0890),m:"Moulsari Avenue",f:1.1}
];
var CITIES=[
 {n:"Mumbai",k:["mumbai","bombay"],p:4200,t:"2h 10m"},{n:"Bengaluru",k:["bengaluru","bangalore"],p:5200,t:"2h 45m"},
 {n:"Kolkata",k:["kolkata","calcutta"],p:4800,t:"2h 20m"},{n:"Jaipur",k:["jaipur"],p:2800,t:"1h 05m"},
 {n:"Hyderabad",k:["hyderabad"],p:4600,t:"2h 15m"},{n:"Chennai",k:["chennai","madras"],p:5600,t:"2h 50m"}
];
function find(list,t){t=t.toLowerCase();for(var i=0;i<list.length;i++)for(var j=0;j<list[i].k.length;j++)if(t.indexOf(list[i].k[j])>-1)return list[i];return null}
function num(t,d){var m=t.match(/\d+/);return m?Math.max(1,+m[0]):d}
function inr(n){return "₹"+Math.round(n).toLocaleString("en-IN")}
function km(a,b){var r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,
  x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);
  return 6371*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.35}

/* ---------- conversation flows ---------- */
var anyPlace=function(t){return find(ORIGINS,t)||find(PLACES,t)};
var FLOWS={
 ride:{steps:[
  {key:"from",q:"Where are you starting from?",chips:ORIGINS.map(function(o){return o.n}),parse:anyPlace,bad:"I don’t know that spot yet. Pick a starting point from the options."},
  {key:"to",q:"Where do you want to go in Delhi?",chips:PLACES.map(function(p){return p.n}),parse:function(t){return find(PLACES,t)},bad:"I can’t find that place. Try one of these popular spots."},
  {key:"when",q:"When do you want to travel?",chips:["Now","Today evening","Tomorrow morning"],parse:function(t){return t}},
  {key:"pax",q:"How many people are travelling?",chips:["1","2","3","4"],parse:function(t){return num(t,1)}}],
  done:ride},
 hotel:{steps:[
  {key:"area",q:"Which area of Delhi do you want to stay in?",chips:PLACES.map(function(p){return p.n}),parse:function(t){return find(PLACES,t)},bad:"I can’t find that area. Pick one of these."},
  {key:"checkin",q:"When do you want to check in?",chips:["Today","Tomorrow","This weekend"],parse:function(t){return t}},
  {key:"nights",q:"How many nights?",chips:["1","2","3","5"],parse:function(t){return num(t,1)}},
  {key:"guests",q:"How many guests?",chips:["1","2","3","4"],parse:function(t){return num(t,1)}}],
  done:hotel},
 flight:{steps:[
  {key:"city",q:"Which city are you flying from? (Destination: Delhi, DEL)",chips:CITIES.map(function(c){return c.n}),parse:function(t){return find(CITIES,t)},bad:"I don’t have that city yet. Pick one of these."},
  {key:"date",q:"What date do you want to fly?",chips:["Tomorrow","This weekend","Next week"],parse:function(t){return t}},
  {key:"pax",q:"How many passengers?",chips:["1","2","3","4"],parse:function(t){return num(t,1)}}],
  done:flight}
};
var flow=null,si=0,ans={},last=[],bookings=[],user=null;
function hello(){return ["Not sure where to go?","Cab or metro to a place","Hotel in Delhi","Flight to Delhi","My bookings"]}

function ride(a){
  var d=km(a.from.c,a.to.c),p=a.pax,cars=Math.ceil(p/4);
  var metroFare=d<=2?10:d<=5?20:d<=12?30:d<=21?40:d<=32?50:60;
  var line=a.from.m+" → "+a.to.m+(a.from.n==="IGI Airport"?" (Airport Express, then change if needed)":"");
  return {title:a.from.n+" → "+a.to.n+" · "+d.toFixed(0)+" km · "+p+" traveller"+(p>1?"s":"")+" · "+a.when,opts:[
   {tier:"Premium",c:"var(--prem)",t:"Private sedan (Premier)",d:"Door to door, AC, driver waits. About "+Math.round(d*3+12)+" min in traffic.",p:(220+d*24)*cars},
   {tier:"Normal",c:"var(--norm)",t:"Cab Mini / Auto",d:"App-booked cab. About "+Math.round(d*3.4+14)+" min in traffic.",p:(70+d*14)*(p>3?2:Math.ceil(p/3))},
   {tier:"Cheapest",c:"var(--cheap)",t:"Delhi Metro + e-rickshaw",d:line+". About "+Math.round(d*2.3+25)+" min.",p:(metroFare+25)*p}]};
}
function hotel(a){var f=a.area.f,n=a.nights,r=Math.ceil(a.guests/2),mt=" Nearest metro: "+a.area.m+".";
  return {title:"Stay near "+a.area.n+" · "+(a.checkin?"check-in "+a.checkin+" · ":"")+n+" night"+(n>1?"s":"")+" · "+a.guests+" guest"+(a.guests>1?"s":""),opts:[
   {tier:"Premium",c:"var(--prem)",t:"5★ luxury hotel",d:"Pool, spa, breakfast included, free cancellation."+mt,p:9500*f*n*r},
   {tier:"Normal",c:"var(--norm)",t:"3–4★ comfort hotel",d:"Clean AC rooms, Wi-Fi, breakfast available."+mt,p:3800*f*n*r},
   {tier:"Cheapest",c:"var(--cheap)",t:"Budget stay / hostel",d:"Simple private room or dorm bed."+mt,p:1100*f*n*r}]};
}
function flight(a){var c=a.city,p=a.pax;
  return {title:c.n+" → Delhi · "+a.date+" · "+p+" passenger"+(p>1?"s":""),opts:[
   {tier:"Premium",c:"var(--prem)",t:"Full-service, flexible fare",d:c.t+", meals, 25 kg bags, free changes.",p:c.p*2.4*p},
   {tier:"Normal",c:"var(--norm)",t:"Full-service, saver fare",d:c.t+", 15 kg bags, changes for a fee.",p:c.p*1.2*p},

function add(txt,who){var d=document.createElement("div");d.className="m "+who;d.textContent=txt;$("thread").appendChild(d);scroll();return d}

function bot(txt,ch,delay){
  var el=add("","bot");el.innerHTML="<span class='dots'><i></i><i></i><i></i></span>";$("dock").innerHTML="";
  setTimeout(function(){el.textContent=txt;if(ch)chips(ch);scroll()},delay===undefined?450:delay)}
function ask(){var s=FLOWS[flow].steps[si];bot(s.q,s.chips)}
function cards(res){
  var wrap=document.createElement("div");wrap.className="tiers";last=res.opts;
  res.opts.forEach(function(o,i){var c=document.createElement("div");c.className="tier";c.style.setProperty("--c",o.c);
    c.innerHTML="<h3></h3><div class='t'></div><div class='d'></div><div class='p'></div>";
    c.children[0].textContent=o.tier;c.children[1].textContent=o.t;c.children[2].textContent=o.d;c.children[3].textContent=inr(o.p);
    var b=document.createElement("button");b.className="btn";b.textContent="Book "+o.tier.toLowerCase();b.onclick=function(){book(i,res.title)};c.appendChild(b);wrap.appendChild(c)});
  $("thread").appendChild(wrap);scroll()}
function book(i,title){
  var o=last[i],ref="DG"+Math.random().toString(36).slice(2,8).toUpperCase();
  bookings.push({ref:ref,title:title,tier:o.tier,t:o.t,p:o.p});confetti();sset("dg_b_"+user.email,bookings);
  add("Book "+o.tier.toLowerCase()+": "+o.t,"me");
  bot("Booked! Reference "+ref+".\n"+title+"\n"+o.t+" · "+inr(o.p)+"\nWe sent the details to "+user.email+". (Demo: no real payment taken.)\n\nWhat else can I book for you?",hello());
  flow=null}
function reset(){flow=null;si=0;ans={}}
function intent(t){t=t.toLowerCase();
  if(/booking|my trips/.test(t))return "mine";
  if(/not sure|don.t know|suggest|idea|explore|recommend|first time|new to|different vibe/.test(t))return "explore";
  if(/hotel|stay|room|hostel/.test(t))return "hotel";
  if(/flight|fly|plane|air ?ticket/.test(t))return "flight";
  if(/cab|taxi|ola|uber|metro|ride|route|reach|visit|go to|tour|see|travel|drop|pickup/.test(t)||find(PLACES,t))return "ride";
  return null}
function startFlow(f,t){flow=f;si=0;ans={};
  var s=FLOWS[f].steps;
  if(t){ // pre-fill anything the user already said
    var pl=find(PLACES,t);
    if(f==="ride"&&pl){ans.to=pl;si=1;var o=find(ORIGINS,t);if(o){ans.from=o;si=2}else{ans.from=null;si=0;}}
    if(f==="hotel"&&pl){ans.area=pl;si=1}
    if(f==="flight"){var c=find(CITIES,t);if(c){ans.city=c;si=1}}
  }
  // for ride, if "to" was prefilled but not "from", ask from first
  if(f==="ride"&&ans.to&&!ans.from){si=0}
  ask()}
function say(t){
  t=t.trim();if(!t)return;add(t,"me");$("msg").value="";
  if(/^(cancel|restart|start over|reset)$/i.test(t)){reset();bot("No problem, we’ll start fresh. What would you like to book?",hello());return}
  var low=t.toLowerCase();
  if(/^cab or metro/.test(low))t="cab";
  if(!flow){
    var it=intent(t);
    if(it==="explore"){exploreAsk();return}
    if(!it){var iv=interestOf(low);if(iv){showIdeas(iv);return}}
    var pl0=find(PLACES,t);
    if(it==="ride"&&pl0&&!/cab|taxi|metro|ride|route|reach|go to|drop|pickup|travel|visit|from/.test(low)){placeMenu(pl0);return}
    if(it==="mine"){reset();
      if(!bookings.length){bot("You have no bookings yet. Tell me where you’re headed and I’ll find options.",hello())}
      else bot("Your bookings:\n"+bookings.map(function(b){return b.ref+" · "+b.tier+" · "+b.t+" · "+inr(b.p)+"\n   "+b.title}).join("\n"),hello());
      return}
    if(it){startFlow(it,t);return}
    bot("I can book cabs and metro routes, hotels and flights for Delhi. Tell me where you want to go, for example “I want to visit Red Fort”.",hello());return}
  var s=FLOWS[flow].steps[si],v=s.parse(t);
  if(v===null||v===undefined||v===""){bot(s.bad||"I didn’t catch that. Could you rephrase?",s.chips);return}
  ans[s.key]=v;si++;
  var steps=FLOWS[flow].steps;
  while(si<steps.length&&ans[steps[si].key])si++;
  if(si<steps.length){ask();return}
  var res=FLOWS[flow].done(ans);flow=null;present(res)}
$("send").onclick=function(){say($("msg").value)};
$("msg").addEventListener("keydown",function(e){if(e.key==="Enter")say($("msg").value)});
